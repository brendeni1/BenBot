services:
  bot:
    build: .
    image: benbot
    container_name: benbot
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      # Idk if this did anything lol vv
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=America/Toronto
    env_file:
      - .env
    command: python -u main.py
